<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookRescue | Daftar</title>
  <link rel="stylesheet" href="onboarding.css">
  <script src="onboarding.js" defer></script>
</head>
<body>
  <main class="scene">
    <div class="signupCard">
      <aside class="brandingPanel">
        <img src="../img/Logo.webp" alt="BookRescue" class="logoTextCard">
        <img src="../img/kucing2.webp" alt="Maskot BookRescue" class="logoCatCard">
      </aside>

      <div class="formPanel">
        <h1>Create Your Account</h1>
        <form data-form>
          <div class="field">
            <label for="name">Nama</label>
            <input id="name" name="name" type="text" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>

          <div class="phoneRow">
            <div class="field">
              <label for="phoneNumSignup">No. Telp</label>
              <input id="phoneNumSignup" name="phoneNumSignup" type="tel" placeholder="08xxxxxxxxxx" required>
            </div>
            <button class="sendCode" type="button" data-send-code>Kirim kode</button>
          </div>

          <div class="verificationSection">
            <label class="verificationLabel">Kode Verifikasi</label>
            <p class="exp">Masukkan kode 5 digit yang telah dikirim ke nomormu.</p>
            <div class="inputCode" aria-label="Kode verifikasi 5 digit">
              <input aria-label="Digit 1" inputmode="numeric" maxlength="1" required>
              <input aria-label="Digit 2" inputmode="numeric" maxlength="1" required>
              <input aria-label="Digit 3" inputmode="numeric" maxlength="1" required>
              <input aria-label="Digit 4" inputmode="numeric" maxlength="1" required>
              <input aria-label="Digit 5" inputmode="numeric" maxlength="1" required>
            </div>
            <p class="verifyLine">
              Tidak menerima kode? <a href="#" onclick="return false;">Kirim Ulang Kode</a>
            </p>
          </div>

          <button class="primary-button" type="submit">Sign Up</button>
          <p class="message" role="status"></p>
          <p class="switch-text">Sudah punya akun? <a href="signin.html">Sign In</a></p>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
